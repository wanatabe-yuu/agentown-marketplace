name: Index

# Rebuilds index.json from the official worlds in worlds/ and the public GitHub
# repositories tagged `agentown-world`. On main it commits index.json only when it
# changed; on pull requests it only checks that the index still builds.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worlds/**", "verified.json", "scripts/**", "package*.json"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The official worlds are pinned to the last commit that changed worlds/.
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the index
        run: npm run index
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit it if it changed
        if: github.event_name != 'pull_request'
        run: |
          git diff --quiet -- index.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "index: update"
          git push
