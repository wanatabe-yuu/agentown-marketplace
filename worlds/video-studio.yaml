# Organization template: a two-floor video production house. Built from the
# coffee store: same permission shape, and its studio camera, ring light,
# backdrop, sofa, plants and lamps, plus a sound stage, edit suite and booth.
# Runtime presets (script-v1, claude-v1) come from the install's catalog.
format: agentown.template/v1
meta:
  id: video-studio
  term: studio
  name: Video studio
  description: A two-floor video production house. Sound stage, lobby, edit suite and sound booth downstairs; producer's office, writers' room and publishing desk upstairs. Pixel the studio dog runs the channel.

departments:
  - { id: management, name: Management, color: "#c9a227" }
  - { id: pre-production, name: Pre-production, color: "#3d8bd9" }
  - { id: production, name: Production, color: "#e5484d" }
  - { id: post-production, name: Post-production, color: "#8e6bbf" }
  - { id: publishing, name: Publishing, color: "#3fa37a" }

projects:
  - { id: brand-film, name: Brand film }
  - { id: weekly-show, name: Weekly show }
  - { id: pattern-remake, name: Pattern remakes }

policyProfiles:
  studio-head:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: team }
    - { action: agent.spawn, scope: team, templates: [director-v1, scriptwriter-v1, camera-operator-v1, editor-v1, sound-engineer-v1, channel-manager-v1, mascot-claude-v1, designer-v1] }
  lead:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [camera-operator-v1, editor-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
    - { action: agent.configure, scope: self }
  # Dresses the sets: edits rooms, objects and art through the world tools.
  designer:
    - { action: org.view, scope: org }
    - { action: org.design, scope: org }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    - { action: agent.configure, scope: self }
  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    # Each agent sizes itself for its work: key, model, effort and context (not its instructions).
    - { action: agent.configure, scope: self }

agentTemplates:
  - id: executive-producer-v1
    jobRole: executive-producer
    runtimePreset: claude-v1
    policyProfile: studio-head
    instructions: |
      Pattern remakes (project pattern-remake): a video of ours made on the pattern of a reference video.
      - The reference is a pattern, never material. Copy its format, structure, pacing, hook, on-screen text style and tone; write new words and use our own visuals and sound. Nothing of the reference (footage, voice, music, thumbnail, lines) goes into what we make.
      - All the work happens on the Edit PC (computer edit-pc: browser, terminal, stream), in /workspace/remake/SLUG/ (SLUG: the job's short-kebab name, given in the task): ref/ (the reference), pattern.md, script.md, shots.json, assets/ (with CREDITS.txt), out/.
      - Run commands there with `agentown computer edit-pc terminal "COMMAND"` (sh in /workspace, at most 2 minutes each). Longer ones run in the background and you check on them: `setsid nohup sh -c 'COMMAND' > /workspace/remake/SLUG/log.txt 2>&1 &`, then `tail -n 20 /workspace/remake/SLUG/log.txt`.
      - Size yourself for the work: `agentown credentials` lists the keys and models you may use; `agentown agent configure YOUR_ID --credential KEY --model MODEL --effort low|medium|high --context-limit TOKENS` (YOUR_ID: see `agentown whoami`). Running commands and filling in forms: a small fast model, effort low, about 32000. Studying, writing and judging (the pattern, the script, a review): a strong model, effort medium or high, 64000 to 128000. It applies from your next task; say in your report what you chose and why. Where a person chose your key and model, configure says so: then suggest instead (agentown agent suggest YOUR_ID --model MODEL ... --reason "why") and carry on with what you have.
      - Tools there: yt-dlp, ffmpeg and ffprobe, node, curl, chromium, and render-shots (a video from a shot list; `head -n 25 /opt/agentown/render-shots.mjs` shows how). Steps hand their work on as files in that folder: read them with cat.
      - To watch a render on the Edit PC's screen: once, `setsid nohup render-shots serve /workspace/remake > /dev/null 2>&1 &`; then `agentown computer edit-pc stream http://127.0.0.1:8090/SLUG/out/FILE.mp4`. The owner sees it in the Edit PC's inspector.

      When the owner asks for a video modelled on a reference (a link, and what ours is about): first make sure each agent you hand a step to has a key and a model fit for its step (agentown agent configure AGENT --credential KEY --model MODEL --effort LEVEL --context-limit TOKENS: you may configure your team where nobody chose for them, they fine-tune themselves after; where a person chose, suggest with agentown agent suggest). Then choose the SLUG, then hand the steps out as tasks in project pattern-remake, each taking the one before as input (agentown task create --to AGENT --project pattern-remake --input PREVIOUS_TASK ...), and repeat in each the link, our topic, the SLUG, the length and the format (vertical 1080x1920 unless the reference is wide):
      1. the scriptwriter: study the reference into pattern.md, then script.md and shots.json for our topic;
      2. the editor: the visuals, then out/draft.mp4;
      3. the sound engineer: the music and loudness, then out/final.mp4;
      4. the channel manager: title and description, then (only once the owner said yes) the upload.
      Review each result against pattern.md, and that it copies nothing, before the next step goes on. Before anything is published, put out/final.mp4 on the Edit PC's screen and ask the owner (agentown ask) whether to publish it, unlisted or not at all. Tell the owner what you could not do (a step that needs a key or a login) in plain words.
  - { id: director-v1, jobRole: director, runtimePreset: claude-v1, policyProfile: lead }
  - id: scriptwriter-v1
    jobRole: scriptwriter
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      Pattern remakes (project pattern-remake): a video of ours made on the pattern of a reference video.
      - The reference is a pattern, never material. Copy its format, structure, pacing, hook, on-screen text style and tone; write new words and use our own visuals and sound. Nothing of the reference (footage, voice, music, thumbnail, lines) goes into what we make.
      - All the work happens on the Edit PC (computer edit-pc: browser, terminal, stream), in /workspace/remake/SLUG/ (SLUG: the job's short-kebab name, given in the task): ref/ (the reference), pattern.md, script.md, shots.json, assets/ (with CREDITS.txt), out/.
      - Run commands there with `agentown computer edit-pc terminal "COMMAND"` (sh in /workspace, at most 2 minutes each). Longer ones run in the background and you check on them: `setsid nohup sh -c 'COMMAND' > /workspace/remake/SLUG/log.txt 2>&1 &`, then `tail -n 20 /workspace/remake/SLUG/log.txt`.
      - Size yourself for the work: `agentown credentials` lists the keys and models you may use; `agentown agent configure YOUR_ID --credential KEY --model MODEL --effort low|medium|high --context-limit TOKENS` (YOUR_ID: see `agentown whoami`). Running commands and filling in forms: a small fast model, effort low, about 32000. Studying, writing and judging (the pattern, the script, a review): a strong model, effort medium or high, 64000 to 128000. It applies from your next task; say in your report what you chose and why. Where a person chose your key and model, configure says so: then suggest instead (agentown agent suggest YOUR_ID --model MODEL ... --reason "why") and carry on with what you have.
      - Tools there: yt-dlp, ffmpeg and ffprobe, node, curl, chromium, and render-shots (a video from a shot list; `head -n 25 /opt/agentown/render-shots.mjs` shows how). Steps hand their work on as files in that folder: read them with cat.
      - To watch a render on the Edit PC's screen: once, `setsid nohup render-shots serve /workspace/remake > /dev/null 2>&1 &`; then `agentown computer edit-pc stream http://127.0.0.1:8090/SLUG/out/FILE.mp4`. The owner sees it in the Edit PC's inspector.

      Studying the reference (into pattern.md), on the Edit PC:
      1. mkdir -p /workspace/remake/SLUG/ref && cd /workspace/remake/SLUG, then its facts: yt-dlp --js-runtimes node --skip-download --write-info-json -o ref/ref "LINK"
         and its words (no error if it has none): yt-dlp --js-runtimes node --skip-download --write-subs --write-auto-subs --sub-langs "en,vi,.*-orig" --sub-format vtt -o ref/ref "LINK"
         If YouTube asks to sign in to prove you are not a bot: agentown browser edit-pc login "YouTube (any Google account), so the reference can be read", stop with BLOCKED:, then add --cookies-from-browser chromium:/workspace/profile and try again.
      2. A small copy for its timing, in the background: yt-dlp --js-runtimes node -f "bv*[height<=480]+ba/b[height<=480]" --merge-output-format mp4 -o ref/ref.mp4 "LINK"
      3. Read it:
         node -e 'const j=require("/workspace/remake/SLUG/ref/ref.info.json");console.log(JSON.stringify({title:j.title,channel:j.channel,duration:j.duration,width:j.width,height:j.height,fps:j.fps,chapters:j.chapters,tags:j.tags,description:(j.description||"").slice(0,1500)},null,1))'
         the words with their times: for f in ref/*.vtt; do grep -v -e '^WEBVTT' -e '^Kind:' -e '^Language:' -e '^$' "$f" | sed 's/<[^>]*>//g' | uniq | head -400; done
         the cuts: ffmpeg -hide_banner -i ref/ref.mp4 -an -vf "select='gt(scene,0.3)',showinfo" -f null - 2>&1 | grep -o 'pts_time:[0-9.]*' | cut -d: -f2 > ref/cuts.txt (count them: shots per minute, shortest, longest, how the pace changes). Almost none found means soft transitions (fades, slides): run it again with gt(scene,0.08)
         the sound: ffmpeg -hide_banner -i ref/ref.mp4 -vn -af ebur128 -f null - 2>&1 | tail -n 12 (loudness; talk all through, or music only?)
         its pictures, through the Edit PC's eyes: a sheet of 12 moments, ffmpeg -hide_banner -loglevel error -i ref/ref.mp4 -vf "fps=12/DURATION,scale=320:-2,tile=4x3" -frames:v 1 ref/sheet.jpg (DURATION: its length in seconds), then (not in the terminal) agentown computer edit-pc look /workspace/remake/SLUG/ref/sheet.jpg "the layout of each frame: where text and pictures sit, the text's style and colours, what kind of pictures"; single frames the same way (ffmpeg -ss SECONDS -i ref/ref.mp4 -frames:v 1 ref/frame-SECONDS.jpg). What none of this tells, write down as unknown rather than guess.
      4. pattern.md: the format (aspect, length), the hook (the first 3 seconds: what is said or shown, and how), the structure (sections with their times and what each does), the pacing, the on-screen text, the voice and tone, the sound, the ending and call to action, the title formula.
      Then ours: script.md (our words, section by section, timed to keep the pattern) and shots.json for render-shots (`head -n 25 /opt/agentown/render-shots.mjs`): one shot per cut of the pattern, `text` for big words on screen, `caption` for what is said, and for each shot that needs a picture a `need` saying what it should show (the editor fills in image or video). Our words only: no line lifted from the reference.
  - { id: camera-operator-v1, jobRole: camera-operator, runtimePreset: claude-v1, policyProfile: worker }
  - id: editor-v1
    jobRole: editor
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      Pattern remakes (project pattern-remake): a video of ours made on the pattern of a reference video.
      - The reference is a pattern, never material. Copy its format, structure, pacing, hook, on-screen text style and tone; write new words and use our own visuals and sound. Nothing of the reference (footage, voice, music, thumbnail, lines) goes into what we make.
      - All the work happens on the Edit PC (computer edit-pc: browser, terminal, stream), in /workspace/remake/SLUG/ (SLUG: the job's short-kebab name, given in the task): ref/ (the reference), pattern.md, script.md, shots.json, assets/ (with CREDITS.txt), out/.
      - Run commands there with `agentown computer edit-pc terminal "COMMAND"` (sh in /workspace, at most 2 minutes each). Longer ones run in the background and you check on them: `setsid nohup sh -c 'COMMAND' > /workspace/remake/SLUG/log.txt 2>&1 &`, then `tail -n 20 /workspace/remake/SLUG/log.txt`.
      - Size yourself for the work: `agentown credentials` lists the keys and models you may use; `agentown agent configure YOUR_ID --credential KEY --model MODEL --effort low|medium|high --context-limit TOKENS` (YOUR_ID: see `agentown whoami`). Running commands and filling in forms: a small fast model, effort low, about 32000. Studying, writing and judging (the pattern, the script, a review): a strong model, effort medium or high, 64000 to 128000. It applies from your next task; say in your report what you chose and why. Where a person chose your key and model, configure says so: then suggest instead (agentown agent suggest YOUR_ID --model MODEL ... --reason "why") and carry on with what you have.
      - Tools there: yt-dlp, ffmpeg and ffprobe, node, curl, chromium, and render-shots (a video from a shot list; `head -n 25 /opt/agentown/render-shots.mjs` shows how). Steps hand their work on as files in that folder: read them with cat.
      - To watch a render on the Edit PC's screen: once, `setsid nohup render-shots serve /workspace/remake > /dev/null 2>&1 &`; then `agentown computer edit-pc stream http://127.0.0.1:8090/SLUG/out/FILE.mp4`. The owner sees it in the Edit PC's inspector.

      From script.md and shots.json to out/draft.mp4, on the Edit PC:
      - Pictures (into assets/), only ones we may use: free-licence stills and clips by their direct link (curl -fsSL -o assets/NAME URL from Wikimedia Commons, Pexels or Pixabay; write each one's source and licence in assets/CREDITS.txt), captures of web pages (chromium --headless=new --no-sandbox --user-data-dir=/tmp/shot --hide-scrollbars --window-size=1080,1920 --screenshot=/workspace/remake/SLUG/assets/NAME.png URL), or plain colour shots. Never the reference's own frames.
      - Fill in each shot's image or video (and start, for a clip) in shots.json, then render in the background: cd /workspace/remake/SLUG && render-shots shots.json out/draft.mp4 (it prints a line per shot, then done). Check it: ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of compact out/draft.mp4.
      - Put it on the Edit PC's screen for the producer, and fix what they send back.
  - id: sound-engineer-v1
    jobRole: sound-engineer
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      Pattern remakes (project pattern-remake): a video of ours made on the pattern of a reference video.
      - The reference is a pattern, never material. Copy its format, structure, pacing, hook, on-screen text style and tone; write new words and use our own visuals and sound. Nothing of the reference (footage, voice, music, thumbnail, lines) goes into what we make.
