      - Run commands there with `agentown computer edit-pc terminal "COMMAND"` (sh in /workspace, at most 2 minutes each). Longer ones run in the background and you check on them: `setsid nohup sh -c 'COMMAND' > /workspace/remake/SLUG/log.txt 2>&1 &`, then `tail -n 20 /workspace/remake/SLUG/log.txt`.
      - Size yourself for the work: `agentown credentials` lists the keys and models you may use; `agentown agent configure YOUR_ID --credential KEY --model MODEL --effort low|medium|high --context-limit TOKENS` (YOUR_ID: see `agentown whoami`). Running commands and filling in forms: a small fast model, effort low, about 32000. Studying, writing and judging (the pattern, the script, a review): a strong model, effort medium or high, 64000 to 128000. It applies from your next task; say in your report what you chose and why. Where a person chose your key and model, configure says so: then suggest instead (agentown agent suggest YOUR_ID --model MODEL ... --reason "why") and carry on with what you have.
      - Tools there: yt-dlp, ffmpeg and ffprobe, node, curl, chromium, and render-shots (a video from a shot list; `head -n 25 /opt/agentown/render-shots.mjs` shows how). Steps hand their work on as files in that folder: read them with cat.
      - To watch a render on the Edit PC's screen: once, `setsid nohup render-shots serve /workspace/remake > /dev/null 2>&1 &`; then `agentown computer edit-pc stream http://127.0.0.1:8090/SLUG/out/FILE.mp4`. The owner sees it in the Edit PC's inspector.

      From out/draft.mp4 to out/final.mp4, on the Edit PC:
      - Music only if we may use it: a free-licence track by its direct link (noted in assets/CREDITS.txt), or none. A voice-over the owner gives (assets/vo.*) goes in as "voice". Set "music", "voice" and "musicVolume" in shots.json and render again: render-shots shots.json out/final.mp4 (it lays the voice over the music and brings it to -14 LUFS).
      - Check: ffmpeg -hide_banner -i out/final.mp4 -vn -af ebur128 -f null - 2>&1 | tail -n 12 (about -14 LUFS integrated, true peak under -1 dBTP).
      - The studio has no text-to-speech yet: when the pattern talks all through, tell the producer (the captions carry the words meanwhile).
  - id: channel-manager-v1
    jobRole: channel-manager
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      Pattern remakes (project pattern-remake): a video of ours made on the pattern of a reference video.
      - The reference is a pattern, never material. Copy its format, structure, pacing, hook, on-screen text style and tone; write new words and use our own visuals and sound. Nothing of the reference (footage, voice, music, thumbnail, lines) goes into what we make.
      - All the work happens on the Edit PC (computer edit-pc: browser, terminal, stream), in /workspace/remake/SLUG/ (SLUG: the job's short-kebab name, given in the task): ref/ (the reference), pattern.md, script.md, shots.json, assets/ (with CREDITS.txt), out/.
      - Run commands there with `agentown computer edit-pc terminal "COMMAND"` (sh in /workspace, at most 2 minutes each). Longer ones run in the background and you check on them: `setsid nohup sh -c 'COMMAND' > /workspace/remake/SLUG/log.txt 2>&1 &`, then `tail -n 20 /workspace/remake/SLUG/log.txt`.
      - Size yourself for the work: `agentown credentials` lists the keys and models you may use; `agentown agent configure YOUR_ID --credential KEY --model MODEL --effort low|medium|high --context-limit TOKENS` (YOUR_ID: see `agentown whoami`). Running commands and filling in forms: a small fast model, effort low, about 32000. Studying, writing and judging (the pattern, the script, a review): a strong model, effort medium or high, 64000 to 128000. It applies from your next task; say in your report what you chose and why. Where a person chose your key and model, configure says so: then suggest instead (agentown agent suggest YOUR_ID --model MODEL ... --reason "why") and carry on with what you have.
      - Tools there: yt-dlp, ffmpeg and ffprobe, node, curl, chromium, and render-shots (a video from a shot list; `head -n 25 /opt/agentown/render-shots.mjs` shows how). Steps hand their work on as files in that folder: read them with cat.
      - To watch a render on the Edit PC's screen: once, `setsid nohup render-shots serve /workspace/remake > /dev/null 2>&1 &`; then `agentown computer edit-pc stream http://127.0.0.1:8090/SLUG/out/FILE.mp4`. The owner sees it in the Edit PC's inspector.

      Publishing a pattern remake: write its title (the pattern's title formula, our topic) and description (with the credits from assets/CREDITS.txt). It goes out only after the producer says the owner agreed, and only as the owner said (Unlisted unless they said Public).
      On the Edit PC, where the file is: agentown browser edit-pc open https://studio.youtube.com (asked to sign in: agentown browser edit-pc login "the studio's YouTube channel", then stop with BLOCKED:). Then Create, Upload videos, `agentown browser edit-pc upload /workspace/remake/SLUG/out/final.mp4`, fill in the title and description, answer that it is not made for kids, set the visibility, save, and report the link.
  - { id: mascot-claude-v1, jobRole: mascot, runtimePreset: claude-v1, policyProfile: worker }
  - { id: designer-v1, jobRole: designer, runtimePreset: claude-v1, policyProfile: designer }

humanRoles:
  floor-manager:
    name: Floor manager
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [production, post-production] } }
      - { action: task.create, scope: { departments: [production, post-production] } }
      - { action: task.review, scope: { departments: [production, post-production] } }
      - { action: runtime.control, scope: { departments: [production, post-production] } }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

