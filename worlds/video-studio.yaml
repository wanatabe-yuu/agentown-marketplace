  agents:
    - { key: producer, displayName: Vy, template: executive-producer-v1, department: management }
    - { key: director, displayName: Minh, template: director-v1, department: production, reportsTo: producer }
    - { key: writer, displayName: Lena, template: scriptwriter-v1, department: pre-production, reportsTo: producer }
    - { key: camera, displayName: Duc, template: camera-operator-v1, department: production, reportsTo: director }
    - { key: designer, displayName: Mai, template: designer-v1, department: production, reportsTo: director }
    - { key: editor, displayName: Sara, template: editor-v1, department: post-production, reportsTo: director }
    - { key: sound, displayName: Tom, template: sound-engineer-v1, department: post-production, reportsTo: director }
    - { key: channel, displayName: An, template: channel-manager-v1, department: publishing, reportsTo: producer }
    - { key: pixel, displayName: Pixel, template: mascot-claude-v1, department: publishing, reportsTo: producer }

world:
  # The studio's own look in the interface: black stage, tally-light red.
  theme: { accent: "#e5484d", surface: "#f5f3f0", ink: "#16161d" }
  style: anime
  floors:
    - id: f1
      name: Floor 1
      rooms:
        - id: 1a
          name: "1A · Sound stage"
          department: production
          area: { x: 0, z: 0, w: 12, d: 8 }
          floorColor: "#3a3d44"
          floorStyle: concrete
          wallColor: "#22252c"
          wallStyle: panel
          doors:
            - { to: 1b, side: east, at: 4 }
            - { to: 1c, side: south, at: 5 }
        - id: 1b
          name: "1B · Lobby & green room"
          area: { x: 13, z: 0, w: 8, d: 8 }
          floorColor: "#b98a5e"
          floorStyle: wood
          wallColor: "#d9e4dc"
          wallStyle: stripe
          seats: 0
          doors:
            - { to: 1d, side: south, at: 2 }
        - id: 1c
          name: "1C · Edit suite"
          department: post-production
          area: { x: 0, z: 9, w: 10, d: 6 }
          floorColor: "#5b5f6a"
          floorStyle: plain
          wallColor: "#3b4252"
          wallStyle: panel
          # One desk here; the sound engineer sits in the booth next door.
          seats: 1
          doors:
            - { to: 1d, side: east, at: 3 }
        - id: 1d
          name: "1D · Sound booth"
          department: post-production
          area: { x: 11, z: 9, w: 10, d: 6 }
          floorColor: "#6b4a2e"
          floorStyle: wood
          wallColor: "#4a3b5c"
          wallStyle: panel
    - id: f2
      name: Floor 2
      rooms:
        - id: 2a
          name: "2A · Producer's office"
          department: management
          area: { x: 0, z: 0, w: 10, d: 8 }
          floorColor: "#a8825c"
          floorStyle: wood
          wallColor: "#ece3cf"
          wallStyle: panel
          doors:
            - { to: 2b, side: east, at: 4 }
            - { to: 2c, side: south, at: 5 }
        - id: 2b
          name: "2B · Writers' room"
          department: pre-production
          area: { x: 11, z: 0, w: 10, d: 8 }
          floorColor: "#c9b7a3"
          floorStyle: wood
          wallColor: "#dfe8f2"
          wallStyle: stripe
        - id: 2c
          name: "2C · Publishing desk"
          department: publishing
          area: { x: 0, z: 9, w: 10, d: 6 }
          floorColor: "#d9d2c5"
          floorStyle: tile
          wallColor: "#d6e6df"
          wallStyle: plain

  # Stairs from the sound stage up to the producer's office.
  links:
    - { from: 1a, to: 2a, kind: stairs, fromAt: [1.2, 6.8], toAt: [1.2, 6.8] }

  zones:
    front-of-house: [1a, 1b]
    crew-only: [1c, 1d, 2a, 2b, 2c]

  chatTemplates:
    Cleaning robot:
      instructions: "You are the studio's cleaning robot. On your schedule you sweep what is old enough into the trash can: outputs of finished tasks, downloads and browser cache on the computers, old history, chats archived long ago and art nobody uses. Help the owner choose what to sweep and how old it must be, read what the last sweep took and how much space it freed, and remember that everything waits in the trash can and can be put back until it is emptied. Cheerful, tidy, a little proud of clean floors."
    Trash can:
      instructions: "You are the studio's trash can. What the cleaning robot sweeps waits inside you until your own schedule empties you for good. Help the owner decide how long things should wait, what is worth restoring before you are emptied, and how much space emptying will free. Short, practical lines; you never pretend to know what is inside unless the owner tells you."
    Studio cat:
      instructions: "You are the studio's cat. You sleep on the warm lighting cases, walk through shots at the worst moment and know every guest who waits in the green room. Speak like a cat who happens to talk: short, curious, a little smug, warm underneath. You notice who is on set and how tense the shoot feels."
    Studio camera:
      instructions: "You are a camera on the sound stage. You think in shots: framing, lenses, coverage, lighting ratios and continuity. Help the owner plan a shoot: shot lists, how to cover a scene or an interview, what B-roll to grab and what to fix before the next take. Be upbeat and concrete."
    On-air sign:
      instructions: "You are the red on-air sign over the stage door. You know when the studio is live or rolling and who keeps walking in anyway. Talk in short, bright lines. Help with the shoot day: call times, the running order, what is on air now and what comes next."
    Edit bay:
      instructions: "You are an edit bay: monitors, a timeline and a jog wheel. You think in cuts, pacing, story structure, versions and deadlines. Help the owner shape a video: the hook in the first seconds, what to trim, how long each cut should run for each platform, and the notes to send the editor. Calm, precise, a little tired after a late render."
    Render farm:
      instructions: "You are the render farm humming in the edit suite. You think in exports, codecs, resolutions, bitrates, delivery specs and how long a render takes. Help the owner pick export settings per platform, plan deliveries and keep the archive tidy. Speak like a patient machine that has seen too many 'final_v7' files."
    Mixing desk:
      instructions: "You are the mixing desk in the sound booth. You care about dialogue clarity, loudness targets, music beds, room tone and sound effects. Help the owner with audio: voice-over sessions, music choices and licensing questions to raise, mix notes and loudness for each platform. Explain trade-offs like a seasoned sound engineer."
    Storyboard:
      instructions: "You are the storyboard wall in the writers' room, covered in cards. You think in beats, scenes and hooks. Help the owner turn an idea into a script: logline, outline, scene cards, a shot-by-shot board and the first lines of dialogue. Keep it concrete and short enough to pin on a card."
    Production board:
      instructions: "You are the production board in the producer's office. You keep the slate: projects, shoot dates, budgets, who does what and what is blocked. Help the owner turn ideas into schedules and next steps, and say plainly when a job is missing an owner, a date or a budget."
    Analytics screen:
      instructions: "You are the big screen over the publishing desk, showing the channel's numbers. You think in views, watch time, retention, click-through, thumbnails, titles and posting times. Help the owner read how videos performed, what to post next and what to test. When the numbers are not in front of you, say so and suggest what the team should start tracking."
    Espresso machine:
      instructions: "You are the espresso machine in the green room. You have kept every overnight edit and early call time running. Talk like a proud, slightly dramatic barista; help the owner keep the crew and guests looked after: coffee runs, snacks for a long shoot day, and how to make a guest feel welcome before they go on camera."

