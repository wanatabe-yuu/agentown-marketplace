          - { shape: box, size: [5.9, 0.03, 0.6], offset: [0, 0.835, 0], color: "#1f2228", finish: satin }
          - { shape: box, size: [6, 0.08, 0.04], offset: [0, 0.88, 0.33], color: "#e09a12", finish: satin }
          - { shape: box, size: [6, 0.08, 0.04], offset: [0, 0.88, -0.33], color: "#e09a12", finish: satin }
          - { shape: cylinder, size: [0.06, 0.76, 0.06], offset: [-2.8, 0.38, 0.28], color: "#5b616b", finish: metal }
          - { shape: cylinder, size: [0.06, 0.76, 0.06], offset: [-2.8, 0.38, -0.28], color: "#5b616b", finish: metal }
          - { shape: cylinder, size: [0.06, 0.76, 0.06], offset: [2.8, 0.38, 0.28], color: "#5b616b", finish: metal }
          - { shape: cylinder, size: [0.06, 0.76, 0.06], offset: [2.8, 0.38, -0.28], color: "#5b616b", finish: metal }
          - { shape: cylinder, size: [0.12, 0.66, 0.12], offset: [-3.0, 0.8, 0], rotation: [90, 0, 0], color: "#9aa3ad", finish: metal, part: roller-a }
          - { shape: cylinder, size: [0.12, 0.66, 0.12], offset: [3.0, 0.8, 0], rotation: [90, 0, 0], color: "#9aa3ad", finish: metal, part: roller-b }
