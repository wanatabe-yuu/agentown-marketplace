          - { shape: sphere, size: [0.15, 0.15, 0.15], offset: [0, 1.24, 1.17], color: "#2b2f36", finish: metal, part: turret }
          - { shape: box, size: [0.04, 0.18, 0.08], offset: [-0.07, 1.1, 1.2], color: "#3b4252", finish: metal, part: turret }
