          - { shape: roundbox, size: [0.36, 0.5, 0.06], offset: [0.62, 1.1, 0.67], color: "#2b2f36", finish: satin }
          - { shape: box, size: [0.28, 0.2, 0.01], offset: [0.62, 1.22, 0.705], color: "#1d2733", emissive: "#3fe08a", finish: gloss, part: screen }
          - { shape: box, size: [0.6, 0.08, 0.3], offset: [-0.2, 0.26, 0.72], color: "#5b616b", finish: metal }
          - { shape: cylinder, size: [0.04, 0.3, 0.04], offset: [0.6, 1.85, -0.4], color: "#2b2f36", finish: metal }
          - { shape: cylinder, size: [0.1, 0.1, 0.1], offset: [0.6, 2.05, -0.4], color: "#7cf2a8", emissive: "#3fe08a", finish: gloss, part: beacon }
      behaviors:
