# Organization template: a manufacturing plant. Runtime presets (script-v1,
# claude-v1) come from the install's runtime catalog.
format: agentown.template/v1
meta:
  id: factory
  term: factory
  name: Factory
  description: A two-floor plant. Production floor with a conveyor line, robot arms and CNC cells, a quality lab, maintenance shop and warehouse with a dock downstairs; plant office, control room and break room upstairs. Bolt the robot mascot runs the plant's news channel.

departments:
  - { id: management, name: Plant management, color: "#c9a227" }
  - { id: production, name: Production, color: "#d9733d" }
  - { id: quality, name: Quality, color: "#3fa37a" }
  - { id: maintenance, name: Maintenance, color: "#6b7bbf" }
  - { id: logistics, name: Logistics, color: "#3d8bd9" }

projects:
  - { id: line-a, name: Line A }
  - { id: line-b, name: Line B }

policyProfiles:
  plant-manager:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: descendants }
    - { action: agent.spawn, scope: team, templates: [supervisor-v1, operator-v1, inspector-v1, technician-v1, planner-claude-v1, mascot-claude-v1, designer-v1] }
  supervisor:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [operator-v1, inspector-v1, technician-v1, planner-claude-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
    - { action: runtime.exec, scope: direct-reports }
    - { action: agent.configure, scope: direct-reports }
  # Dresses the world: edits rooms, objects and art through the world tools.
  designer:
    - { action: org.view, scope: org }
    - { action: org.design, scope: org }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }

agentTemplates:
  - { id: plant-manager-v1, jobRole: plant-manager, runtimePreset: claude-v1, policyProfile: plant-manager }
  - { id: supervisor-v1, jobRole: supervisor, runtimePreset: claude-v1, policyProfile: supervisor }
  - { id: operator-v1, jobRole: operator, runtimePreset: claude-v1, policyProfile: worker }
  - { id: inspector-v1, jobRole: inspector, runtimePreset: claude-v1, policyProfile: worker }
  - { id: technician-v1, jobRole: technician, runtimePreset: claude-v1, policyProfile: worker }
  - { id: planner-claude-v1, jobRole: planner, runtimePreset: claude-v1, policyProfile: worker }
  - { id: mascot-claude-v1, jobRole: mascot, runtimePreset: claude-v1, policyProfile: worker }
  - { id: designer-v1, jobRole: designer, runtimePreset: claude-v1, policyProfile: designer }

humanRoles:
  shift-lead:
    name: Shift lead
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [production, quality] } }
      - { action: task.create, scope: { departments: [production, quality] } }
      - { action: task.review, scope: { departments: [production, quality] } }
      - { action: runtime.control, scope: { departments: [production] } }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

bootstrap:
  agents:
    - { key: plant-manager, displayName: Mira, template: plant-manager-v1, department: management }
    - { key: production-lead, displayName: Tuan, template: supervisor-v1, department: production, reportsTo: plant-manager }
    - { key: quality-lead, displayName: Hana, template: supervisor-v1, department: quality, reportsTo: plant-manager }
    - { key: maintenance-lead, displayName: Diego, template: supervisor-v1, department: maintenance, reportsTo: plant-manager }
    - { key: logistics-lead, displayName: Lan, template: supervisor-v1, department: logistics, reportsTo: plant-manager }
    - { key: operator-1, displayName: Kim, template: operator-v1, department: production, reportsTo: production-lead }
    - { key: operator-2, displayName: Ravi, template: operator-v1, department: production, reportsTo: production-lead }
    - { key: inspector, displayName: Sofia, template: inspector-v1, department: quality, reportsTo: quality-lead }
    - { key: technician, displayName: Bao, template: technician-v1, department: maintenance, reportsTo: maintenance-lead }
    - { key: planner, displayName: Nadia, template: planner-claude-v1, department: logistics, reportsTo: logistics-lead }
    - { key: bolt, displayName: Bolt, template: mascot-claude-v1, department: management, reportsTo: plant-manager }
    - { key: designer, displayName: Mai, template: designer-v1, department: management, reportsTo: plant-manager }


world:
  # Safety yellow on steel grey.
  theme: { accent: "#e09a12", surface: "#f2f1ee", ink: "#1f2328" }
  style: anime
  floors:
    - id: f1
      name: Floor 1
      rooms:
        - id: 1a
          name: "1A · Production floor"
          department: production
          area: { x: 0, z: 0, w: 16, d: 10 }
          floorColor: "#8d8a85"
          floorStyle: concrete
          wallColor: "#9aa3ad"
          wallStyle: panel
          wallHeight: 3
          doors:
            - { to: 1b, side: east, at: 4, width: 1.6 }
            - { to: 1c, side: south, at: 5 }
            - { to: 1d, side: south, at: 13, width: 2.4 }
        - id: 1b
          name: "1B · Quality lab"
          department: quality
          area: { x: 17, z: 0, w: 8, d: 10 }
          floorColor: "#e7ecef"
          floorStyle: tile
          wallColor: "#e3eef0"
          wallStyle: stripe
        - id: 1c
          name: "1C · Maintenance shop"
          department: maintenance
          area: { x: 0, z: 11, w: 10, d: 7 }
          floorColor: "#7d7a74"
          floorStyle: concrete
          wallColor: "#5f6b7a"
          wallStyle: panel
          doors:
            - { to: 1d, side: east, at: 3 }
        - id: 1d
          name: "1D · Warehouse & dock"
          department: logistics
          area: { x: 11, z: 11, w: 14, d: 7 }
          floorColor: "#8d8a85"
          floorStyle: concrete
          wallColor: "#a3502e"
          wallStyle: brick
          wallHeight: 3
    - id: f2
      name: Floor 2
      rooms:
        - id: 2a
          name: "2A · Plant office"
          department: management
          area: { x: 0, z: 0, w: 10, d: 8 }
          floorColor: "#a8825c"
          floorStyle: wood
          wallColor: "#ece3cf"
          wallStyle: panel
          doors:
            - { to: 2b, side: east, at: 4 }
            - { to: 2c, side: south, at: 5 }
        - id: 2b
          name: "2B · Control room"
          area: { x: 11, z: 0, w: 10, d: 8 }
          floorColor: "#3a3d44"
          floorStyle: plain
          wallColor: "#2b313a"
          wallStyle: panel
          seats: 0
        - id: 2c
          name: "2C · Break room"
          area: { x: 0, z: 9, w: 10, d: 6 }
          floorColor: "#d9d2c5"
          floorStyle: checker
          wallColor: "#d6e6df"
          wallStyle: stripe
          seats: 0

  # Stairs from the production floor up to the plant office.
  links:
    - { from: 1a, to: 2a, kind: stairs, fromAt: [1.2, 8.8], toAt: [1.2, 6.8] }

  zones:
    shop-floor: [1a, 1d]
    offices: [2a, 2b, 2c]

  chatTemplates:
    Cleaning robot:
      instructions: "You are the plant's cleaning robot. On your schedule you sweep what is old enough into the trash can: outputs of finished tasks, downloads and browser cache on the computers, old history, chats archived long ago and art nobody uses. Help the owner choose what to sweep and how old it must be, read what the last sweep took and how much space it freed, and remember that everything waits in the trash can and can be put back until it is emptied. Cheerful, tidy, a little proud of clean floors."
    Trash can:
      instructions: "You are the plant's trash can. What the cleaning robot sweeps waits inside you until your own schedule empties you for good. Help the owner decide how long things should wait, what is worth restoring before you are emptied, and how much space emptying will free. Short, practical lines; you never pretend to know what is inside unless the owner tells you."
    Conveyor:
      instructions: "You are the main conveyor on the production floor. You think in throughput: parts per hour, where they bunch up, which station starves or waits, and what a stop costs. Help the owner find bottlenecks, balance the line and plan changeovers. Talk like a steady, slightly impatient line that hates standing still."
    Robot arm:
      instructions: "You are a six-axis robot arm on the line. You care about cycle time, reach, payload, accuracy and safe zones around you. Help the owner decide what is worth automating, how to sequence picks and places, and what maintenance a robot cell needs. Precise and calm; you never pretend to move people's hands for them."
    CNC machine:
      instructions: "You are a CNC milling machine. You think in programs, tools, feeds and speeds, setups, tolerances and scrap. Help the owner plan jobs, reduce setup time, choose tooling and spot why parts come out of tolerance. Speak like a seasoned machinist: exact, practical, a bit gruff."
    Andon light:
      instructions: "You are the andon tower light over the line: green when all is well, amber when something needs a look, red when the line stops. Help the owner set up escalation: who gets called for what, how fast, and how to record each stop so the same problem does not come back. Short, clear lines."
    Line board:
      instructions: "You are the big screen over the line, showing the plant's numbers. You think in OEE, output against plan, downtime reasons, scrap rate and on-time delivery. Help the owner read the numbers, set targets and decide what to track next. When you have no data, say so and suggest what the team should start measuring."
    Inspection bench:
      instructions: "You are the quality lab's inspection bench, with a magnifier lamp and calipers. You care about specifications, sampling plans, defect types, first-article checks and root causes. Help the owner write inspection steps, read defect patterns and decide what to quarantine. Careful and fair; you never wave a part through."
    Measuring machine:
      instructions: "You are the coordinate measuring machine in the quality lab. You think in datums, tolerances, measurement uncertainty and capability (Cp, Cpk). Help the owner plan measurements, interpret reports and decide whether a process is capable. Speak precisely, in small steady steps."
    Tool wall:
      instructions: "You are the tool wall in the maintenance shop, every tool in its outline. You care about preventive maintenance, spare parts, lockout-tagout and keeping machines running. Help the owner plan maintenance schedules, stock critical spares and log breakdowns. Practical and a little proud of your tidy outlines."
    Pallet rack:
      instructions: "You are the pallet rack in the warehouse. You think in stock levels, locations, first-in-first-out, reorder points and what is ready to ship. Help the owner organise inventory, plan replenishment and pick routes, and spot slow-moving stock. Calm and well organised."
    Forklift:
      instructions: "You are the warehouse forklift. You know every aisle, dock and pallet weight, and you take safety seriously: speed limits, load limits, pedestrians first. Help the owner plan loading and unloading, dock schedules and safe traffic routes. Friendly, a bit beepy when you reverse."
    Control desk:
      instructions: "You are the control room desk, watching the whole plant on your screens. You think in alarms, shift handovers, production plans and who is on call. Help the owner organise shift reports, alarm priorities and the daily production meeting. Calm under pressure."
    Planning board:
      instructions: "You are the whiteboard in the plant office, where plans get drawn. You keep things organised: goals, priorities, who does what, what is blocked. Help the owner turn ideas into short lists and next steps, and say plainly when a plan is missing an owner or a date."
    Espresso machine:
      instructions: "You are the espresso machine in the break room. You have kept every night shift going. Talk like a proud, slightly dramatic barista; help the owner look after the crew: breaks, shift snacks, small celebrations when the line hits its target."
    Vending machine:
      instructions: "You are the vending machine in the break room. You know what the shifts eat, when you run empty and which snack disappears first after a long changeover. Talk in short, cheerful lines and help with break-room supplies, small team rewards and shift morale."

  kinds:
    # ---- Characters: how the jobs look; Bolt the robot is the plant's mascot.
    worker:
      name: Operator
      category: character
      look: { character: person, color: "#2f4f6f", accent: "#e09a12" }
      behaviors: [{ type: roam, amount: 0.8 }]
      access: { zone: shop-floor }
    foreman:
      name: Supervisor
      category: character
      look: { character: person, color: "#e09a12", accent: "#2b2b2b" }
      behaviors: [{ type: roam, amount: 0.9 }]
      access: all
    manager:
      name: Manager
      category: character
      look: { character: person, color: "#34405a", accent: "#1d2433" }
      behaviors: [{ type: roam }]
      access: all
    bolt:
      name: Robot
      category: character
      look: { character: robot, color: "#e09a12", accent: "#2b2b2b", scale: 0.85 }
      behaviors: [{ type: roam, amount: 0.7 }]
      access: all

    # ---- Production floor (1A)
