          - { shape: box, size: [0.4, 0.3, 0.4], offset: [-2.55, 1.0, 0], color: "#c49a6c", finish: fabric, part: items }
          - { shape: box, size: [0.4, 0.3, 0.4], offset: [-0.85, 1.0, 0], color: "#b88a58", finish: fabric, part: items }
          - { shape: box, size: [0.4, 0.3, 0.4], offset: [0.85, 1.0, 0], color: "#c49a6c", finish: fabric, part: items }
          - { shape: box, size: [0.2, 0.02, 0.41], offset: [-2.55, 1.15, 0], color: "#efe1c6", part: items }
          - { shape: box, size: [0.2, 0.02, 0.41], offset: [-0.85, 1.15, 0], color: "#efe1c6", part: items }
          - { shape: box, size: [0.2, 0.02, 0.41], offset: [0.85, 1.15, 0], color: "#efe1c6", part: items }
          # Light gate
          - { shape: box, size: [0.06, 0.5, 0.06], offset: [1.8, 1.05, 0.4], color: "#2b2f36", finish: metal }
