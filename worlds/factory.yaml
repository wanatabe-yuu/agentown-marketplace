        - { type: spin, part: roller-b, axis: z, speed: 0.8 }
        - { type: keyframes, part: items, speed: 0.25, keys: [{ t: 0, position: [0, 0, 0] }, { t: 0.98, position: [1.7, 0, 0] }] }
        - { type: blink, part: sensor, speed: 1.2 }
      states:
        - { id: running, name: Running }
        - { id: stopped, name: Stopped, behaviors: [], glow: 0.3 }
      actions:
        - { id: stop, name: Stop the line, state: stopped, seconds: 120, gesture: use }
    robot-arm:
      name: Robot arm
