          - { shape: cylinder, size: [0.55, 0.02, 0.55], offset: [0, 2.27, 0], color: "#fff4d6", emissive: "#ffe3a1", finish: gloss, part: light }
      behaviors:
        - { type: flicker, part: light, speed: 0.3, amount: 0.2 }
      states:
