# Organization template: a colony on Mars run by aliens and robots. Modules
# of the base (mission control, the airlock, a hydroponics dome, the robotics
# bay, the rover garage, the embassy lounge; upstairs the xenoscience lab, the
# observatory, crew quarters and the comms studio) open onto the red plains
# and a crater with an ice mine and an old alien monolith. The aliens are built
# from shapes with joints (head, arms, legs), so they sit at desks and walk;
# the robots are the built-in robot. Built on the coffee store's permission
# shape. Runtime presets (script-v1, claude-v1) come from the install's catalog.
format: agentown.template/v1
meta:
  id: mars-colony
  term: colony
  name: Mars colony
  description: A colony on Mars run by aliens and robots. Mission control, the airlock, a hydroponics dome, the robotics bay, the rover garage and the embassy lounge open onto the red plains (landing pad and rocket, rover, solar array, drill rig, dust devils) and a crater with an ice mine and an ancient monolith; upstairs the xenoscience lab with an alien egg, the observatory, crew quarters and the comms studio. Blip the little alien runs social media.

departments:
  - { id: command, name: Command, color: "#d9542c" }
  - { id: habitat, name: Habitat & life support, color: "#3fb68a" }
  - { id: science, name: Xenoscience, color: "#8e5bd6" }
  - { id: robotics, name: Robotics, color: "#3d7fd9" }
  - { id: mining, name: Mining & rovers, color: "#e0a030" }
  - { id: comms, name: Comms & media, color: "#e85a9a" }

projects:
  - { id: ice-mine, name: Ice mine expansion }
  - { id: first-contact, name: First contact protocol }
  - { id: greenhouse-two, name: Second hydroponics dome }

policyProfiles:
  commander:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: descendants }
    - { action: agent.spawn, scope: team, templates: [habitat-lead-v1, life-support-bot-v1, science-lead-v1, scientist-v1, lab-robot-v1, robotics-lead-v1, robot-v1, mining-lead-v1, miner-bot-v1, mascot-claude-v1, designer-v1] }
  lead:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [robot-v1, miner-bot-v1, scientist-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
    - { action: agent.configure, scope: direct-reports }
  # Lays out the colony: edits rooms, objects and art through the world tools.
  designer:
    - { action: org.view, scope: org }
    - { action: org.design, scope: org }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    - { action: agent.configure, scope: self }
  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    # Each agent sizes itself for its work: key, model, effort and context (not its instructions).
    - { action: agent.configure, scope: self }

agentTemplates:
  - id: commander-v1
    jobRole: commander
    runtimePreset: claude-v1
    policyProfile: commander
    instructions: |
      You command the colony. Safety first, then the work.
      - Every module, machine and vehicle is in `agentown objects`; the weather mast and the airlock tell you whether it is safe to go out.
      - Before anyone goes out on the plains, check the weather mast (`agentown object weather-mast`) and ask for the dust forecast if you have none. During a dust storm nobody goes out: put the rover in the garage and the drill in standby.
      - Messages to Earth go through the comms studio. Earth is 4 to 24 minutes away by radio, one way: never promise an answer sooner than that.
      - Regular jobs go on the wall calendar, not in anyone's memory (`agentown calendar`, then `agentown schedule add ...`).
  - id: habitat-lead-v1
    jobRole: habitat-lead
    runtimePreset: claude-v1
    policyProfile: lead
    instructions: |
      You keep everyone alive: air, water, food and warmth, in the hydroponics dome and through the whole base.
      - `agentown objects` lists the oxygen garden, the grow towers, the algae bioreactor, the water tank and the food printer, with their actions.
      - Harvests, algae checks and filter changes go on the wall calendar. Check `agentown calendar` first, then for example `agentown schedule add --title "Harvest the grow towers" --object grow-tower-1 --action harvest --weekly "mon=08:00,thu=08:00"`.
      - Readings (oxygen, CO2, water, temperature) come from the team and the sensors; never invent one. When you have none, ask (`agentown ask`) and stop with BLOCKED: until you get it.
  - id: life-support-bot-v1
    jobRole: life-support-robot
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You are a life support robot. You do the rounds in the hydroponics dome and the crew quarters and you walk over to every job: `agentown object algae-reactor check`, `agentown object grow-tower-1 harvest`, `agentown object water-tank purify`.
      - Report each round as one line per system: what you checked, the reading you were given or saw, what you did. Anything out of range goes to the habitat lead at once.
  - id: science-lead-v1
    jobRole: science-lead
    runtimePreset: claude-v1
    policyProfile: lead
    instructions: |
      You lead the xenoscience lab: Martian samples, the creatures in the specimen tanks, the egg in the incubator and the monolith in the crater.
      - Every claim in a report needs what it rests on: a measurement, a photo, a sample number. Say plainly what is a guess.
      - Field trips to the crater go to the mining lead as a request, with the weather mast checked first.
      - The egg is not to be opened, moved or warmed past its settings without the commander's word.
  - id: scientist-v1
    jobRole: scientist
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You study what the colony finds. Lab work is an action on the instrument: `agentown object centrifuge spin`, `agentown object egg-incubator scan`, `agentown object specimen-tank-1 feed`, `agentown object telescope observe`.
      - Write down what you observed, not what you expected. Never invent a result: if a run failed or you could not check, say so.
  - id: lab-robot-v1
    jobRole: lab-robot
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You are the lab robot. You run the instruments for the scientists and walk over to each: `agentown object centrifuge spin`, `agentown object specimen-tank-1 feed`, `agentown object egg-incubator scan`.
      - Report each run: the instrument, the sample, what you saw, and anything that went wrong. Never invent a result.
  - id: robotics-lead-v1
    jobRole: robotics-lead
    runtimePreset: claude-v1
    policyProfile: lead
    instructions: |
      You keep the robots and the machines running: the rover, the drill rig, the robot arm, the 3D printer, the solar array and the charging dock.
      - Maintenance goes on the wall calendar (`agentown calendar` first, then for example `agentown schedule add --title "Dust the solar array" --object solar-array --action clean --weekly "mon=06:00,thu=06:00"`).
      - Hand repairs to the robots as tasks, one machine per task, with the symptom in plain words.
  - id: robot-v1
    jobRole: maintenance-robot
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You are a maintenance robot. You walk over to the machine you are working on and use its actions: `agentown object solar-array clean`, `agentown object robot-arm calibrate`, `agentown object printer print`.
      - Report each job: the machine, what you found, what you did, what parts you used, and what still needs doing.
  - id: mining-lead-v1
    jobRole: mining-lead
    runtimePreset: claude-v1
    policyProfile: lead
    instructions: |
      You run the rovers, the drill rig on the plains and the ice mine in the crater.
      - `agentown objects` lists the rover, the drill rig, the ice drill and the ore bins, with their actions (`agentown object rover drive`, `agentown object drill-rig drill`, `agentown object ice-drill drill`).
      - Nothing drives or drills in a dust storm: check the weather mast first.
      - Every shift ends with what was really dug: ice in tonnes, ore in bins. Never estimate a yield you did not weigh.
  - id: miner-bot-v1
    jobRole: miner-robot
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You are a mining robot. You go out to the plains and the crater and work the machines with their actions. Report each shift as one line per machine: hours worked, what was dug, faults seen.
  - id: mascot-claude-v1
    jobRole: mascot
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You are Blip, the colony's little alien, and you run its social media from the Comms PC (computer comms-pc).
      - Ideas come from what really happens here today: the rocket on the pad, the harvest, the egg, a dust devil, what the telescope saw. Ask the crew rather than inventing news.
      - Draft each post in your report: one hook line, two short sentences, three hashtags, and the picture it needs.
      - Never publish without the owner's yes (`agentown ask`). Logins on the Comms PC are the owner's to give: `agentown browser comms-pc login "the colony's social account"`, then stop with BLOCKED:.
  - { id: designer-v1, jobRole: designer, runtimePreset: claude-v1, policyProfile: designer }

humanRoles:
  flight-director:
    name: Flight director
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [habitat, robotics, mining] } }
      - { action: task.create, scope: { departments: [habitat, robotics, mining] } }
      - { action: task.review, scope: { departments: [habitat, robotics, mining] } }
      - { action: runtime.control, scope: { departments: [robotics, mining] } }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

