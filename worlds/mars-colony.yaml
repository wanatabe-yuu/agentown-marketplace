          - { shape: sphere, size: [0.17, 0.22, 0.06], offset: [0.13, 1.45, -0.22], rotation: [0, 0, -22], color: "#14181f", finish: gloss, part: head }
          - { shape: sphere, size: [0.04, 0.04, 0.01], offset: [-0.11, 1.5, -0.255], color: "#ffffff", emissive: "#ffffff", part: head }
          - { shape: sphere, size: [0.04, 0.04, 0.01], offset: [0.15, 1.5, -0.255], color: "#ffffff", emissive: "#ffffff", part: head }
          - { shape: box, size: [0.1, 0.015, 0.01], offset: [0, 1.3, -0.24], color: "#2b5a2b", part: head }
          - { shape: sphere, size: [0.07, 0.035, 0.02], offset: [-0.18, 1.34, -0.2], color: "#ff9fb0", part: head }
          - { shape: sphere, size: [0.07, 0.035, 0.02], offset: [0.18, 1.34, -0.2], color: "#ff9fb0", part: head }
          - { shape: capsule, size: [0.025, 0.26, 0.025], offset: [-0.12, 1.78, 0], rotation: [0, 0, 18], color: "#7fd36b", part: head }
          - { shape: capsule, size: [0.025, 0.26, 0.025], offset: [0.12, 1.78, 0], rotation: [0, 0, -18], color: "#7fd36b", part: head }
          - { shape: sphere, size: [0.08, 0.08, 0.08], offset: [-0.16, 1.92, 0], color: "#ffd166", emissive: "#ffb703", finish: gloss, part: head }
