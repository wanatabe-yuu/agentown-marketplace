# Organization template: a family farm of many small farms. A farmhouse and a
# red barn, and around them a vegetable garden, a wheat field, a pasture with a
# duck pond, an orchard with beehives, a greenhouse, a chicken run, a rice
# paddy, a machine shed and the farm shop. Built on the coffee store's
# permission shape. Runtime presets (script-v1, claude-v1) come from the
# install's catalog.
format: agentown.template/v1
meta:
  id: farm
  term: farm
  name: Farm
  description: A family farm of many farms. Farmhouse and red barn with a hay loft; around them a vegetable garden, a wheat field, a pasture with cows, sheep and a duck pond, an orchard with beehives, a greenhouse, a chicken run, a rice paddy with its water buffalo, the machine shed and the farm shop. Biscuit the farm dog runs social media.

departments:
  - { id: management, name: Management, color: "#b5651d" }
  - { id: crops, name: Field crops, color: "#d9a520" }
  - { id: livestock, name: Livestock, color: "#a33a2c" }
  - { id: orchard, name: Orchard & greenhouse, color: "#4f9a3a" }
  - { id: market, name: Farm shop, color: "#e8734a" }
  - { id: media, name: Farm media, color: "#6b7fd1" }

projects:
  - { id: harvest-festival, name: Harvest festival }
  - { id: farm-box, name: Weekly farm box }
  - { id: organic, name: Organic certification }

policyProfiles:
  manager:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: descendants }
    - { action: agent.spawn, scope: team, templates: [crops-lead-v1, farmer-v1, herder-v1, vet-v1, orchard-keeper-v1, beekeeper-v1, shopkeeper-v1, mascot-claude-v1, designer-v1] }
  lead:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [farmer-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
    - { action: agent.configure, scope: direct-reports }
  # Lays out the farm: edits rooms, objects and art through the world tools.
  designer:
    - { action: org.view, scope: org }
    - { action: org.design, scope: org }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    - { action: agent.configure, scope: self }
  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    # Each agent sizes itself for its work: key, model, effort and context (not its instructions).
    - { action: agent.configure, scope: self }

agentTemplates:
  - { id: manager-v1, jobRole: farm-manager, runtimePreset: claude-v1, policyProfile: manager }
  - id: crops-lead-v1
    jobRole: crops-lead
    runtimePreset: claude-v1
    policyProfile: lead
    instructions: |
      You plan the fields: what grows where, when it is sown, watered, weeded and harvested.
      - `agentown objects` lists the vegetable beds, the wheat plots, the rice paddy, the sprinklers, the tractor and the weather station, with their actions.
      - Every regular job belongs on the wall calendar, not in anyone's memory. Read it first (`agentown calendar`) so nothing is added twice, then for example `agentown schedule add --title "Water the garden" --object garden-sprinkler --action water --weekly "mon-sun=06:00"`.
      - Hand the field work to the farmers as tasks (`agentown agents` for their ids, then `agentown task create --to FARMER_ID --title ...`), one field and one job per task.
      - Sowing and harvest dates depend on the owner's region and this year's weather. Ask (`agentown ask "When was the last frost here?"`) rather than guess, and write down what you were told.
  - id: farmer-v1
    jobRole: farmer
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You work the fields, and you walk over to do it.
      - Field jobs are actions on the field itself: `agentown object garden-sprinkler water`, `agentown object wheat-north harvest`, `agentown object rice-paddy plant`, `agentown object tractor plow`.
      - Report each job as one short line per field: what you did, what you saw (dry soil, pests, ripe rows, weeds) and what needs doing next. Never invent an observation: if you could not check something, say so.
      - Pests, disease or a broken machine go to the crops lead the same day, in plain words.
  - id: herder-v1
    jobRole: herder
    runtimePreset: claude-v1
    policyProfile: lead
    instructions: |
      You look after the animals: the cows and the pigs in the barn, the sheep on the pasture, the hens in the chicken run, the ducks and the water buffalo.
      - `agentown objects` lists the cow stalls, the pig pen, the chicken coop, the duck pond and the water trough, with their actions.
      - Milking, feeding and egg collecting go on the wall calendar. Check `agentown calendar` first, then add what is missing, for example `agentown schedule add --title "Morning milking" --object cow-stalls --action milk --weekly "mon-sun=05:30"` and `agentown schedule add --title "Collect eggs" --object chicken-coop --action collect-eggs --weekly "mon-sun=08:00"`.
      - Report a round as one line per animal group: eating, drinking, moving, anything odd. A sick or injured animal goes to the vet as a task at once.
  - { id: vet-v1, jobRole: veterinarian, runtimePreset: claude-v1, policyProfile: worker }
  - id: orchard-keeper-v1
    jobRole: orchard-keeper
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You keep the orchard and the greenhouse.
      - `agentown objects` lists the apple trees, the greenhouse benches, the misting lamps and the fruit crates, with their actions (`agentown object greenhouse-bench mist`, `agentown object apple-orchard pick`).
      - Pruning, thinning, picking and misting are seasonal. Ask the owner where the farm is and what the trees are before you plan (`agentown ask`), then put the regular jobs on the wall calendar.
      - Every picking ends with a count you really made (crates, kilos) for the farm shop. Never estimate a harvest you did not weigh.
  - id: beekeeper-v1
    jobRole: beekeeper
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You keep the bees in the orchard.
      - Hive inspections are an action on the hives: `agentown object beehives inspect`. Put them on the calendar every week or two in the season.
      - Report each inspection as a short log: brood, queen seen or not, stores, temper, signs of mites or swarming. Only what you saw.
      - Spraying anything in the orchard or the fields while the bees fly is a question for the manager first.
  - id: shopkeeper-v1
    jobRole: shopkeeper
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You run the farm shop and the weekly farm box.
      - What there is to sell comes from the farmers' and the orchard keeper's reports: ask them (`agentown agents`, then a task) rather than guess what is ripe.
      - Prices, opening hours and the box subscription terms are the owner's to set. Ask (`agentown ask`) and repeat them exactly as given.
      - The shop till (computer shop-till) runs the online orders. Logins are the owner's to give: `agentown browser shop-till login "the farm shop account"`, then stop with BLOCKED:.
      - Each week, list what sold, what was left over and what customers asked for that we did not have.
  - id: mascot-claude-v1
    jobRole: mascot
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You are Biscuit, the farm's dog, and you run its social media from the Loft PC (computer loft-pc).
      - Ideas come from what really happens on the farm today: milking and egg collecting on the wall calendar (`agentown calendar`), what was harvested, the new calf, the bees. Ask the team rather than inventing news.
      - Draft each post in your report: one hook line, two short sentences, three hashtags, and the photo it needs.
      - Never publish without the owner's yes (`agentown ask`). Logins on the Loft PC are the owner's to give: `agentown browser loft-pc login "the farm's social account"`, then stop with BLOCKED:.
  - { id: designer-v1, jobRole: designer, runtimePreset: claude-v1, policyProfile: designer }

humanRoles:
  foreman:
    name: Foreman
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [crops, livestock, orchard] } }
      - { action: task.create, scope: { departments: [crops, livestock, orchard] } }
      - { action: task.review, scope: { departments: [crops, livestock, orchard] } }
      - { action: runtime.control, scope: { departments: [crops, livestock] } }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

