# Organization template: a hospital's administrative side. Agents coordinate
# paperwork, scheduling and supplies; they do not make clinical decisions.
# Runtime presets come from the install's catalog.
format: agentown.template/v1
meta:
  id: hospital
  term: hospital
  name: Hospital
  description: A hospital's administrative side on two floors. Lobby and admissions, pharmacy store, scheduling and medical records downstairs; director's office and staff lounge upstairs. Pip the robot mascot keeps patients and visitors informed. No clinical decisions.

departments:
  - { id: administration, name: Administration, color: "#c9a227" }
  - { id: admissions, name: Admissions, color: "#3d8bd9" }
  - { id: scheduling, name: Scheduling, color: "#8e6bbf" }
  - { id: pharmacy, name: Pharmacy supply, color: "#3fa37a" }
  - { id: records, name: Medical records, color: "#d9733d" }

projects:
  - { id: ward-3, name: Ward 3 }
  - { id: outpatient, name: Outpatient clinic }

policyProfiles:
  director:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: descendants }
    - { action: agent.spawn, scope: team, templates: [coordinator-v1, clerk-v1, assistant-claude-v1, mascot-claude-v1, designer-v1] }
  coordinator:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [clerk-v1, assistant-claude-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
  # Dresses the world: edits rooms, objects and art through the world tools.
  designer:
    - { action: org.view, scope: org }
    - { action: org.design, scope: org }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }

agentTemplates:
  - { id: director-v1, jobRole: director, runtimePreset: claude-v1, policyProfile: director }
  - { id: coordinator-v1, jobRole: coordinator, runtimePreset: claude-v1, policyProfile: coordinator }
  - { id: clerk-v1, jobRole: clerk, runtimePreset: claude-v1, policyProfile: worker }
  - { id: assistant-claude-v1, jobRole: assistant, runtimePreset: claude-v1, policyProfile: worker }
  - { id: mascot-claude-v1, jobRole: mascot, runtimePreset: claude-v1, policyProfile: worker }
  - { id: designer-v1, jobRole: designer, runtimePreset: claude-v1, policyProfile: designer }

humanRoles:
  head-nurse:
    name: Head nurse
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [admissions, scheduling] } }
      - { action: task.create, scope: { departments: [admissions, scheduling] } }
      - { action: task.review, scope: { departments: [admissions, scheduling] } }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

bootstrap:
  agents:
    - { key: director, displayName: Dr. Okafor, template: director-v1, department: administration }
    - { key: admissions-lead, displayName: Mai, template: coordinator-v1, department: admissions, reportsTo: director }
    - { key: scheduling-lead, displayName: Theo, template: coordinator-v1, department: scheduling, reportsTo: director }
    - { key: pharmacy-lead, displayName: Ines, template: coordinator-v1, department: pharmacy, reportsTo: director }
    - { key: records-lead, displayName: Kwame, template: coordinator-v1, department: records, reportsTo: director }
    - { key: admissions-clerk, displayName: Lucy, template: clerk-v1, department: admissions, reportsTo: admissions-lead }
    - { key: scheduling-assistant, displayName: Jonas, template: assistant-claude-v1, department: scheduling, reportsTo: scheduling-lead }
    - { key: pharmacy-clerk, displayName: Ivy, template: clerk-v1, department: pharmacy, reportsTo: pharmacy-lead }
    - { key: records-clerk, displayName: Sana, template: clerk-v1, department: records, reportsTo: records-lead }
    - { key: pip, displayName: Pip, template: mascot-claude-v1, department: administration, reportsTo: director }
    - { key: designer, displayName: Mai, template: designer-v1, department: administration, reportsTo: director }


