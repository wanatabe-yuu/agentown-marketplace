    - { key: life-support, displayName: Lars, template: life-support-v1, department: life-support, reportsTo: director }
    - { key: guest-host, displayName: Mia, template: guest-host-v1, department: visitors, reportsTo: director }
    - { key: educator, displayName: Noor, template: educator-v1, department: education, reportsTo: director }
    - { key: pip, displayName: Pip, template: mascot-claude-v1, department: education, reportsTo: educator }
