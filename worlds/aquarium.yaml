      look: { character: person, color: "#f2f5f7", accent: "#2b3a4a" }
      behaviors: [{ type: roam, amount: 0.6 }]
      access: { rooms: [2b, 2d, 1a, 1b] }
    technician:
      name: Technician
      category: character
      look: { character: person, color: "#e0b13a", accent: "#3a3a3a" }
      behaviors: [{ type: roam, amount: 0.7 }]
      access: { rooms: [1d, 1a, 1b, 2d] }
    guide:
      name: Guide
      category: character
      look: { character: person, color: "#e8734a", accent: "#2b2b2b" }
      behaviors: [{ type: roam, amount: 0.9 }]
      access: { zone: public }
    educator:
      name: Educator
      category: character
      look: { character: person, color: "#8e6bbf", accent: "#2a1f3d" }
      behaviors: [{ type: roam, amount: 0.7 }]
      access: { rooms: [2c, 1a, 1b, 1c] }
    # A penguin built from shapes. Each jointed part starts with a tiny bead at
    # its joint, so the head turns at the neck, the flippers at the shoulders
    # and the legs fold at the hips when it sits at a desk.
    penguin-agent:
      name: Penguin
      category: character
      look:
        parts:
          - { shape: sphere, size: [0.62, 0.8, 0.56], offset: [0, 0.82, 0], color: "#23272e", finish: satin }
          - { shape: sphere, size: [0.46, 0.64, 0.2], offset: [0, 0.78, -0.2], color: "#f7f7f2", finish: satin }
          - { shape: torus, size: [0.5, 0.5, 0.5], offset: [0, 1.15, 0], rotation: [90, 0, 0], color: "#1f9bb5", finish: fabric }
          - { shape: sphere, size: [0.02, 0.02, 0.02], offset: [0, 1.16, 0], color: "#23272e", part: head }
          - { shape: sphere, size: [0.5, 0.46, 0.46], offset: [0, 1.38, 0], color: "#23272e", finish: satin, part: head }
          - { shape: sphere, size: [0.36, 0.3, 0.12], offset: [0, 1.35, -0.17], color: "#f7f7f2", part: head }
          - { shape: sphere, size: [0.07, 0.1, 0.03], offset: [-0.08, 1.39, -0.235], color: "#1b1b1f", finish: gloss, part: head }
          - { shape: sphere, size: [0.07, 0.1, 0.03], offset: [0.08, 1.39, -0.235], color: "#1b1b1f", finish: gloss, part: head }
          - { shape: sphere, size: [0.025, 0.025, 0.01], offset: [-0.07, 1.42, -0.252], color: "#ffffff", emissive: "#ffffff", part: head }
          - { shape: sphere, size: [0.025, 0.025, 0.01], offset: [0.09, 1.42, -0.252], color: "#ffffff", emissive: "#ffffff", part: head }
          - { shape: cone, size: [0.1, 0.14, 0.08], offset: [0, 1.3, -0.28], rotation: [-90, 0, 0], color: "#ff9f1c", finish: satin, part: head }
          - { shape: sphere, size: [0.07, 0.035, 0.02], offset: [-0.14, 1.31, -0.215], color: "#f29a9a", part: head }
          - { shape: sphere, size: [0.07, 0.035, 0.02], offset: [0.14, 1.31, -0.215], color: "#f29a9a", part: head }
          - { shape: sphere, size: [0.02, 0.02, 0.02], offset: [-0.29, 1.0, 0], color: "#23272e", part: arm-l }
          - { shape: capsule, size: [0.1, 0.42, 0.2], offset: [-0.31, 0.8, 0], rotation: [0, 0, -12], color: "#23272e", finish: satin, part: arm-l }
          - { shape: sphere, size: [0.02, 0.02, 0.02], offset: [0.29, 1.0, 0], color: "#23272e", part: arm-r }
          - { shape: capsule, size: [0.1, 0.42, 0.2], offset: [0.31, 0.8, 0], rotation: [0, 0, 12], color: "#23272e", finish: satin, part: arm-r }
          - { shape: sphere, size: [0.02, 0.02, 0.02], offset: [-0.12, 0.5, 0], color: "#ff9f1c", part: leg-l }
          - { shape: capsule, size: [0.09, 0.42, 0.09], offset: [-0.12, 0.27, 0], color: "#ff9f1c", part: leg-l }
          - { shape: roundbox, size: [0.16, 0.06, 0.22], offset: [-0.12, 0.03, -0.06], color: "#ff9f1c", finish: satin, part: leg-l }
          - { shape: sphere, size: [0.02, 0.02, 0.02], offset: [0.12, 0.5, 0], color: "#ff9f1c", part: leg-r }
          - { shape: capsule, size: [0.09, 0.42, 0.09], offset: [0.12, 0.27, 0], color: "#ff9f1c", part: leg-r }
          - { shape: roundbox, size: [0.16, 0.06, 0.22], offset: [0.12, 0.03, -0.06], color: "#ff9f1c", finish: satin, part: leg-r }
      behaviors: [{ type: roam, amount: 0.6 }]
      access: all
    # Guests: they wander the public rooms and can be asked what they think.
    visitor:
      name: Visitor
      title: Visitor
      category: dynamic
      look: { character: person, color: "#ff8fa3", accent: "#3b2a20" }
      behaviors: [{ type: roam, amount: 0.7 }]
      access: { zone: public }
      states:
        - { id: strolling, name: Strolling }
        - { id: amazed, name: Amazed, pose: happy, auto: true, behaviors: [] }
    visitor-blue:
      name: Visitor
      title: Visitor
      category: dynamic
      look: { character: person, color: "#4fa3e0", accent: "#2b2b2b" }
      behaviors: [{ type: roam, amount: 0.6 }]
      access: { zone: public }
      states:
        - { id: strolling, name: Strolling }
        - { id: amazed, name: Amazed, pose: happy, auto: true, behaviors: [] }
    visitor-kid:
