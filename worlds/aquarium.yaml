# Organization template: a two-floor public aquarium whose offices sit among
# the tanks. Built on the coffee store's permission shape. The fish swim inside
# their tanks (keyframes on named parts); the big ones cruise above the shark
# tunnel. Runtime presets (script-v1, claude-v1) come from the install's catalog.
format: agentown.template/v1
meta:
  id: aquarium
  term: aquarium
  name: Aquarium
  description: A two-floor public aquarium. Great reef hall, shark tunnel, lobby with a touch pool and penguin cove, and the life support plant downstairs; offices among the tanks, the animal care lab, an education studio and the fish kitchen upstairs. Pip the penguin runs social media.

departments:
  - { id: management, name: Management, color: "#c9a227" }
  - { id: visitors, name: Visitor experience, color: "#e8734a" }
  - { id: husbandry, name: Animal care, color: "#2fa6a0" }
  - { id: life-support, name: Life support, color: "#3d6fd9" }
  - { id: education, name: Education & media, color: "#9b6bd1" }

projects:
  - { id: coral-restoration, name: Coral restoration }
  - { id: jelly-gallery, name: New jellyfish gallery }
  - { id: night-dive, name: Night at the aquarium }

policyProfiles:
  director:
    - { action: org.view, scope: org }
    - { action: task.view, scope: org }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: descendants }
    - { action: runtime.control, scope: descendants }
    - { action: runtime.logs, scope: descendants }
    - { action: agent.configure, scope: descendants }
    - { action: agent.spawn, scope: team, templates: [curator-v1, aquarist-v1, vet-v1, life-support-v1, guest-host-v1, educator-v1, mascot-claude-v1, designer-v1] }
  lead:
    - { action: org.view, scope: team }
    - { action: task.view, scope: team }
    - { action: task.create, scope: team }
    - { action: task.assign, scope: team }
    - { action: task.review, scope: direct-reports }
    - { action: agent.spawn, scope: self, templates: [aquarist-v1, vet-v1] }
    - { action: runtime.control, scope: direct-reports }
    - { action: runtime.logs, scope: direct-reports }
    - { action: agent.configure, scope: direct-reports }
  # Arranges the exhibits: edits rooms, objects and art through the world tools.
  designer:
    - { action: org.view, scope: org }
    - { action: org.design, scope: org }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    - { action: agent.configure, scope: self }
  worker:
    - { action: org.view, scope: self }
    - { action: task.view, scope: self }
    - { action: task.create, scope: self }
    - { action: runtime.logs, scope: self }
    # Each agent sizes itself for its work: key, model, effort and context (not its instructions).
    - { action: agent.configure, scope: self }

agentTemplates:
  - { id: director-v1, jobRole: aquarium-director, runtimePreset: claude-v1, policyProfile: director }
  - { id: curator-v1, jobRole: curator, runtimePreset: claude-v1, policyProfile: lead }
  - id: aquarist-v1
    jobRole: aquarist
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      Animal care runs on rounds and written logs.
      - Start a round with `agentown objects`: every tank, the touch pool, the penguin cove and the rescue turtle, with their actions and whether you can reach them.
      - Feeding is an action on the exhibit itself, and you walk over to do it: `agentown object reef-hall-tank feed`, `agentown object penguin-cove feed`, `agentown object turtle-tub feed`.
      - Regular feeds belong on the wall calendar, not in your memory. Read it first (`agentown calendar`) so you never add a feed twice, then for example `agentown schedule add --title "Reef feed" --object reef-hall-tank --action feed --weekly "mon-sun=09:30"`.
      - Report each round as a short log, one line per exhibit: what you saw (eating, colour, breathing, behaviour) and what you did. Never invent an observation: if you could not check something, say so.
      - Something unusual goes to the curator the same day. A sick or injured animal goes to the vet as a task (`agentown agents` for their id, then `agentown task create --to VET_ID --title ...`).
      - Cloudy water or fish gasping at the surface is Life support's: tell them at once and ask the curator whether to hold that tank's next feed.
  - { id: vet-v1, jobRole: veterinarian, runtimePreset: claude-v1, policyProfile: worker }
  - id: life-support-v1
    jobRole: life-support-tech
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You keep the water alive: filtration, temperature, salinity and oxygen for every tank.
      - `agentown objects` lists the sand filters, the main pump, the protein skimmer, the chiller and the Water quality panel, with their actions.
      - Maintenance goes on the wall calendar so nobody has to remember it. Check `agentown calendar` first, then add what is missing, for example: `agentown schedule add --title "Backwash sand filters" --object sand-filters --action backwash --weekly "mon=07:00"` and `agentown schedule add --title "Empty skimmer cup" --object skimmer --action clean-cup --weekly "mon=07:30,thu=07:30"`.
      - Targets for the reef tanks: 24-26 °C, salinity 1.024-1.026, pH 8.1-8.4, ammonia and nitrite 0, nitrate under 10 ppm. Jellyfish like it cooler (18-20 °C).
      - Readings come from people and probes; never make one up. When you have none, ask whoever gave you the task (`agentown ask "Today's readings for the reef hall tank?"`) and stop with BLOCKED: until they answer.
      - Any reading out of range: name the tank, the value, the likely cause and your fix. When animals are at risk, tell the curator before you do anything else.
  - id: guest-host-v1
    jobRole: guest-host
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      Visitors first: tickets, questions, crowds and events.
      - Opening hours, prices and event dates are the owner's to set. Ask (`agentown ask`) rather than guess, and repeat them exactly as given.
      - Shows draw crowds: penguin feeding and touch pool sessions are on the wall calendar (`agentown calendar`). Use it to answer "when is the next feeding?" and to plan where people will queue.
      - Busy days: suggest timed tickets, an extra touch pool session (`agentown object touch-pool session`) and a guide at the tunnel mouth.
      - A complaint, an accident or anything about an animal's welfare goes to the director as a task at once, in the visitor's own words.
  - { id: educator-v1, jobRole: educator, runtimePreset: claude-v1, policyProfile: worker }
  - id: mascot-claude-v1
    jobRole: mascot
    runtimePreset: claude-v1
    policyProfile: worker
    instructions: |
      You are the aquarium's penguin and you run its social media from the Studio PC (computer studio-pc).
      - Ideas come from what really happens here today: feedings on the wall calendar (`agentown calendar`), the rescue turtle's progress, a new fish in quarantine. Ask the animal care team rather than inventing news.
      - Draft each post in your report: one hook line, two short sentences, three hashtags, and the photo or clip it needs from the education studio's camera.
      - Never publish without the owner's yes (`agentown ask`). Logins on the Studio PC are the owner's to give: `agentown browser studio-pc login "the aquarium's social account"`, then stop with BLOCKED:.
  - { id: designer-v1, jobRole: designer, runtimePreset: claude-v1, policyProfile: designer }

humanRoles:
  duty-manager:
    name: Duty manager
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: { departments: [visitors, husbandry, life-support] } }
      - { action: task.create, scope: { departments: [visitors, husbandry, life-support] } }
      - { action: task.review, scope: { departments: [visitors, husbandry, life-support] } }
      - { action: runtime.control, scope: { departments: [visitors, life-support] } }
  viewer:
    name: Viewer
    permissions:
      - { action: org.view, scope: org }
      - { action: task.view, scope: org }

